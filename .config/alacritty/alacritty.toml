[window]
decorations = "none" # full
startup_mode = "Maximized"
padding = { x = 2, y = 1 }

[font]
normal = { family = "UbuntuMono Nerd Font", style = "Regular" }
size = 13

[cursor]
style = { shape = "Beam" }

[mouse]
hide_when_typing = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# VS Code "Dark+" / Windows Terminal "Dark+".
[colors.primary]
background = "#1e1e1e"
foreground = "#eeeeee"

[colors.cursor]
cursor = "#ffffff"
text = "#1e1e1e"

[colors.selection]
background = "#264f78"
text = "CellForeground"

[colors.normal]
black = "#000000"
red = "#cd3131"
green = "#0dbc79"
yellow = "#e5e510"
blue = "#2472c8"
magenta = "#bc3fbc"
cyan = "#11a8cd"
white = "#e5e5e5"

[colors.bright]
black = "#666666"
red = "#f14c4c"
green = "#23d18b"
yellow = "#f5f543"
blue = "#3b8eea"
magenta = "#d670d6"
cyan = "#29b8db"
white = "#e5e5e5"
